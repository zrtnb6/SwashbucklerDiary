name: iOS Native Build

# 侠客日记 iOS 原生客户端的云端构建流程。
# - push / PR 到 main 时编译 + 跑单元测试
# - 手动触发时可以产出未签名 IPA（可自行用 AltStore / Sideloadly 等工具重签）
# - 仓库配置了签名 Secrets 时，额外导出已签名 IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      build_ipa:
        description: '是否打包 IPA'
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: SwashbucklerDiary
  PROJECT: ios/SwashbucklerDiary.xcodeproj

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version

      - name: Install simulator runtime check
        run: |
          xcrun simctl list runtimes | head -20

      - name: Resolve available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|Air)" | head -1 | sed -E 's/.*(iPhone [^(]+)\(.*/\1/' | xargs)
          if [ -z "$DEVICE" ]; then DEVICE="iPhone 16"; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "选用模拟器：$DEVICE"

      - name: Build (Release, device)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Report build artifacts
        run: |
          APP=build/Build/Products/Release-iphoneos/SwashbucklerDiary.app
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh "$APP"
          file "$APP/SwashbucklerDiary"
          lipo -info "$APP/SwashbucklerDiary" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test | tee test.log

      - name: Collect test summary
        if: always()
        run: |
          echo "### 单元测试" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ tests" test.log | tail -5 >> "$GITHUB_STEP_SUMMARY" || echo "未取得测试统计" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwashbucklerDiary-app-unsigned
          path: build/Build/Products/Release-iphoneos/SwashbucklerDiary.app
          retention-days: 14
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7
          if-no-files-found: warn

  package-ipa:
    name: Package IPA
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP=build/Build/Products/Release-iphoneos/SwashbucklerDiary.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          ZIP_NAME="SwashbucklerDiary-$(date +%Y%m%d%H%M)-unsigned.ipa"
          zip -qry "$ZIP_NAME" Payload
          echo "ipa=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$ZIP_NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          # 明确标注：这是未签名包，需要自行签名后才能安装
          echo "### IPA（未签名）" >> "$GITHUB_STEP_SUMMARY"
          echo "文件名：\`$ZIP_NAME\`（$(du -h "$ZIP_NAME" | cut -f1)）" >> "$GITHUB_STEP_SUMMARY"
          echo "> 该包**未签名**，无法直接安装。请使用 AltStore / Sideloadly / Xcode 用自己的证书重签。" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwashbucklerDiary-ipa-unsigned
          path: ${{ steps.package.outputs.ipa }}
          retention-days: 30

      # secrets 上下文不允许出现在 if 表达式中（工作流会被判为无效），
      # 因此先用一步探测，把结果写进 output，后面的步骤再按 output 判断。
      - name: Detect signing secrets
        id: signing_check
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "检测到签名证书 Secrets，将尝试导出已签名 IPA"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名证书 Secrets，只产出未签名 IPA"
          fi

      - name: Import signing certificate (optional)
        id: signing
        if: steps.signing_check.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA (optional)
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-signed \
            -archivePath build-signed/SwashbucklerDiary.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive -allowProvisioningUpdates

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build-signed/SwashbucklerDiary.xcarchive \
            -exportPath build-signed/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload signed IPA (optional)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwashbucklerDiary-ipa-signed
          path: build-signed/export/*.ipa
          retention-days: 30
